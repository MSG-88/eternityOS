source /boot/grub/config.cfg

menuentry "Eternity 08 Live" --hotkey=l {
    linux @KERNEL_LIVE@ @APPEND_LIVE@
    initrd @INITRD_LIVE@
}

menuentry "Eternity 08 Live (safe graphics)" --hotkey=s {
    linux @KERNEL_LIVE@ @APPEND_LIVE@ nomodeset
    initrd @INITRD_LIVE@
}

menuentry "Eternity 08 Self-test" --hotkey=t {
    linux @KERNEL_LIVE@ @APPEND_LIVE@ noeject eternity.test console=ttyS0,115200
    initrd @INITRD_LIVE@
}

menuentry "Eternity 08 Live (Eternity shell)" --hotkey=n {
    linux @KERNEL_LIVE@ @APPEND_LIVE@ eternity.session=eternity
    initrd @INITRD_LIVE@
}

menuentry "Eternity 08 Live (Eternity shell + greeter)" --hotkey=g {
    linux @KERNEL_LIVE@ @APPEND_LIVE@ eternity.session=eternity eternity.greeter=greetd
    initrd @INITRD_LIVE@
}

submenu 'Utilities ...' --hotkey=u {

    source /boot/grub/theme.cfg

    if [ "${grub_platform}" = "efi" ]; then
        menuentry "UEFI Firmware Settings" --hotkey=f {
            fwsetup
        }
    fi

    if @ENABLE_VERIFY_CHECKSUMS@; then
        menuentry "Verify integrity of the boot medium" --hotkey=v {
            linux @KERNEL_LIVE@ @APPEND_VERIFY_CHECKSUMS@
            initrd @INITRD_LIVE@
        }
    fi
}
