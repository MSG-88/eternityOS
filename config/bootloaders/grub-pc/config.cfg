set default=0
set timeout=8

if [ x$feature_default_font_path = xy ] ; then
    font=unicode
else
    font=$prefix/unicode.pf2
fi

if loadfont $font ; then
    set gfxmode=auto
    set gfxpayload=keep
    insmod efi_gop
    insmod efi_uga
    insmod video_bochs
    insmod video_cirrus
    insmod all_video
else
    set gfxmode=auto
    insmod all_video
fi

insmod gfxterm
insmod png

# Under Secure Boot GRUB 2.12 is locked down and refuses font files from the medium
# ("prohibited by secure boot policy"); the theme then falls back to the built-in
# unicode font. Only load the Eternity fonts when that would succeed (BIOS, or EFI
# with Secure Boot off) so UEFI boots do not flash three error lines before the menu.
if [ "$lockdown" != "y" ]; then
    loadfont $prefix/themes/eternity/inter-18.pf2
    loadfont $prefix/themes/eternity/inter-bold-28.pf2
    loadfont $prefix/themes/eternity/mono-16.pf2
fi

source /boot/grub/theme.cfg

terminal_output gfxterm
