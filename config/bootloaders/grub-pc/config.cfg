set default=0
set timeout=8

if [ x$feature_default_font_path = xy ] ; then
    font=unicode
else
    font=$prefix/unicode.pf2
fi

if loadfont $font ; then
    set gfxmode=auto
    set gfxpayload=keep
    insmod efi_gop
    insmod efi_uga
    insmod video_bochs
    insmod video_cirrus
    insmod all_video
else
    set gfxmode=auto
    insmod all_video
fi

insmod gfxterm
insmod png

loadfont $prefix/themes/eternity/inter-18.pf2
loadfont $prefix/themes/eternity/inter-bold-28.pf2
loadfont $prefix/themes/eternity/mono-16.pf2

source /boot/grub/theme.cfg

terminal_output gfxterm
