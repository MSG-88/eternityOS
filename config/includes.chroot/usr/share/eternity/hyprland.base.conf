# Eternity 08 — Hyprland configuration template, rendered by eternity-theme into
# ~/.config/eternity/generated/hyprland.conf. Edit ~/.config/eternity/{theme,layout,keys}.toml, not this.
monitor=,preferred,auto,${scale}

env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = XDG_CURRENT_DESKTOP,Eternity

general {
    gaps_in = ${gaps_in}
    gaps_out = ${gaps_out}
    border_size = ${border}
    col.active_border = rgb(${accent})
    col.inactive_border = rgb(${n800})
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = ${rounding}
    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
        ignore_opacity = true
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = ${animations}
    bezier = enter, 0.33, 1, 0.68, 1
    bezier = draw, 0.37, 0, 0.63, 1
    animation = windows, 1, ${enter_s}, enter, popin 92%
    animation = windowsOut, 1, 4, draw, popin 92%
    animation = layers, 1, 3, enter, fade
    animation = fade, 1, 4, enter
    animation = workspaces, 1, ${sweep_s}, draw, slide
    animation = border, 1, 6, enter
}

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

gestures {
    workspace_swipe = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    background_color = rgb(${bg})
    vfr = true
    vrr = 0
}

dwindle {
    pseudotile = true
    preserve_split = true
}

windowrulev2 = noborder, class:^(eternity-)
windowrulev2 = float, class:^(eternity-firstrun)$$
windowrulev2 = center, class:^(eternity-firstrun)$$
${layer_rules}

${execs}

${binds}
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
