# Eternity 08 idle policy: lock after 5 min on battery / 15 min on mains, screen off a minute later,
# lock before sleep. eternity-lock asks the shell to show the lock scene.
general {
    lock_cmd = eternity-lock
    before_sleep_cmd = eternity-lock
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 300
    on-timeout = sh -c '[ "$(cat /sys/class/power_supply/AC*/online 2>/dev/null | head -1)" = 1 ] || eternity-lock'
}

listener {
    timeout = 900
    on-timeout = eternity-lock
}

listener {
    timeout = 960
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
