[greeter]
# Installed systems use the plain wallpaper; the live session switches this to the
# greeter image with the credential hint (live-config component 0031-eternity-user).
background=/usr/share/eternity/wallpaper-1920x1080.png
user-background=false
theme-name=Arc-Dark
icon-theme-name=Papirus-Dark
font-name=Inter 11
xft-antialias=true
xft-hintstyle=hintslight
xft-rgba=rgb
default-user-image=/usr/share/eternity/logo-128.png
hide-user-image=false
indicators=~spacer;~clock;~spacer;~session;~power
clock-format=%H:%M
position=50%,center 55%,center
panel-position=bottom
screensaver-timeout=0
