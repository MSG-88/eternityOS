# Calamares configuration for Eternity 08 (based on calamares-settings-debian)
---
modules-search: [ local, /usr/lib/calamares/modules ]

# Explicit instance so Calamares always loads modules/shellprocess@eternity.conf for the
# shellprocess@eternity step (the post-install fix-ups inside the installed system).
instances:
- id: eternity
  module: shellprocess
  config: shellprocess@eternity.conf

oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - luksbootkeyfile
  - dpkg-unsafe-io
  # Debian's sources-media / sources-media-unmount / bootloader-config helpers are left
  # out: they expect a package pool on the medium and a network (apt-get install grub-efi),
  # and bootloader-config runs update-grub before grub-install has created /boot/grub,
  # which aborted the install. Calamares' own bootloader module does grub-install and
  # grub-mkconfig with the grub-*-bin packages this image ships.
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - grubcfg
  - bootloader
  - packages
  - shellprocess@eternity
  - plymouthcfg
  - initramfscfg
  - initramfs
  - dpkg-unsafe-io-undo
  - sources-final
  - umount
- show:
  - finished

branding: eternity
prompt-install: true
dont-chroot: false
