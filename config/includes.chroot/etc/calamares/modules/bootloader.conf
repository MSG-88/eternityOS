# Calamares bootloader module for Eternity 08 (overrides calamares-settings-debian).
---
efiBootLoader: "grub"

# systemd-boot settings (unused: efiBootLoader is grub, kept for the module's schema)
kernel: "/vmlinuz-linux"
img: "/initramfs-linux.img"
fallback: "/initramfs-linux-fallback.img"
timeout: "10"

grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"

# Directory EFI/Eternity_08 on the ESP and the firmware entry name.
efiBootloaderId: "Eternity_08"

# Debian's default (true) copies the bare signed grubx64.efi to EFI/boot/bootx64.efi. That
# loader is built with prefix /EFI/debian and looks for grub.cfg next to itself; launched
# through the fallback path it finds neither and drops to a `grub>` prompt (reproduced in
# QEMU, 2026-10-25). It also overwrites the Windows fallback loader on a shared ESP.
# /usr/lib/eternity/post-install.sh installs a working removable fallback instead
# (shim + GRUB + grub.cfg), and only when no Windows loader owns EFI/boot.
installEFIFallback: false
