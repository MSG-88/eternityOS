---
userGroup:       users
defaultGroups:
    - cdrom
    - floppy
    - sudo
    - audio
    - dip
    - video
    - plugdev
    - netdev
    - lpadmin
    - scanner
    - bluetooth
autologinGroup:  autologin
sudoersGroup:    sudo
setRootPassword: false
doAutologin:     false
# A personal OS: the owner chooses the password. Length and character classes are free, the
# dictionary and similarity checks are off (the live attempt refused a plain word), and the
# "allow weak passwords" box is shown and ticked by default.
allowWeakPasswords: true
allowWeakPasswordsDefault: true
passwordRequirements:
    nonempty: true
    minLength: -1
    maxLength: -1
    libpwquality:
        - minlen=0
        - minclass=0
        - dictcheck=0
        - usercheck=0
        - enforcing=0
