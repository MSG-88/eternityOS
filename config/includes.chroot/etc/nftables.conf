#!/usr/sbin/nft -f
# Eternity 08 firewall: nothing comes in unless this machine asked for it.
# Outbound traffic is unrestricted; inbound allows only replies, loopback (the local AI
# server on 127.0.0.1:8080 and the embedding server on 8081 are reachable only from this
# machine), ICMP for path discovery and DHCPv6/IPv6 neighbour discovery.
# Opening a service deliberately: add a rule under "input" and run `nft -f /etc/nftables.conf`.
flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;

        iif "lo" accept
        ct state established,related accept
        ct state invalid drop

        # ICMP: echo (ping) is allowed, rate limited; the rest keeps IPv4/IPv6 working
        ip protocol icmp icmp type { destination-unreachable, time-exceeded, parameter-problem } accept
        ip protocol icmp icmp type echo-request limit rate 5/second accept
        ip6 nexthdr icmpv6 icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem,
                                         nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert, mld-listener-query } accept
        ip6 nexthdr icmpv6 icmpv6 type echo-request limit rate 5/second accept

        # DHCPv6 client replies
        udp dport 546 ip6 daddr fe80::/10 accept

        # everything else is logged (rate limited) and dropped
        limit rate 3/minute log prefix "eternity-fw drop: " level info
    }
    chain forward {
        type filter hook forward priority filter; policy drop;
    }
    chain output {
        type filter hook output priority filter; policy accept;
    }
}
