# Eternity 08 bootloader defaults (installed systems)
GRUB_DISTRIBUTOR="Eternity 08"
GRUB_THEME=/usr/share/grub/themes/eternity/theme.txt
GRUB_GFXMODE=auto
GRUB_GFXPAYLOAD_LINUX=keep
GRUB_TIMEOUT=3
GRUB_TIMEOUT_STYLE=menu
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash"
GRUB_BACKGROUND=
# Dual boot: let os-prober add Windows (and other systems) to the menu.
GRUB_DISABLE_OS_PROBER=false
