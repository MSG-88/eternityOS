# Eternity 08 hardware quirks (owner's laptop: MSI Alpha 15 A3DDK, Ryzen 3750H, RX 5500M, Realtek 8822CE)
# Realtek 8822CE: PCIe ASPM causes disconnects and firmware timeouts; the stable choice is to disable it.
options rtw88_pci disable_aspm=1
# Realtek Bluetooth over USB keeps the link alive across suspend
options btusb enable_autosuspend=0
