# greetd: the Eternity greeter. eternity-greeter runs the Quickshell unlock scene under cage and
# falls back to the text greeter (agreety) on the VT when the scene cannot run. Active only when
# eternity.greeter=greetd selected it (live-config component 0032) or Settings switched the display
# manager; lightdm stays otherwise. greetd.service carries OnFailure=lightdm.service.
[terminal]
vt = 7

[default_session]
command = "eternity-greeter"
user = "_greetd"
